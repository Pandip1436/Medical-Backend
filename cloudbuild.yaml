# Cloud Build pipeline for the medical-backend service.
#
# Migrations now run as a dedicated Cloud Build step (see "migrate" below)
# instead of inside the container's CMD. Two reasons:
#   1. The container had a 240s startup probe; cold-start + Neon wake +
#      `prisma migrate deploy` could exceed it, so deploys were timing out.
#   2. Migration failures should fail the build clearly, not silently crash-
#      loop the container while traffic stays on the old revision.
#
# Required Cloud Build trigger settings (set in the trigger UI under
# Advanced -> Substitution variables — never commit these):
#   _DATABASE_URL = PROD Neon pooler connection string (runtime queries).
#   _DIRECT_URL   = same Neon connection but the NON-pooler hostname
#                   (e.g. drop "-pooler" from the host). Required because
#                   Prisma takes a session-level advisory lock during
#                   `migrate deploy`; Neon's pooler runs in transaction mode
#                   and drops that lock between queries.

steps:
  # 1. Build the production image.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/medical-backend:$COMMIT_SHA'
      - '.'

  # 2. Push the image to GCR.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/medical-backend:$COMMIT_SHA'

  # 3. Apply Prisma migrations to PROD using the just-built image. If this
  #    step fails the deploy is aborted and the previous revision keeps
  #    serving traffic — much safer than crash-looping a half-migrated app.
  #
  #    The precondition check below fails fast with an obvious message when
  #    the trigger forgot to set _DATABASE_URL; Prisma's own error in that
  #    case is cryptic and the build-step log isn't always available.
  - name: 'gcr.io/$PROJECT_ID/medical-backend:$COMMIT_SHA'
    id: 'migrate'
    entrypoint: 'sh'
    # Cloud Build steps default working directory to /workspace, but our
    # image's prisma/schema.prisma lives at /app (Dockerfile WORKDIR). We
    # cd in explicitly so prisma can find the schema. The $$ escapes are
    # required because Cloud Build treats single-$ as its own substitution.
    args:
      - '-c'
      - |
        set -e
        if [ -z "$$DATABASE_URL" ] || [ -z "$$DIRECT_URL" ]; then
          echo ""
          echo "==========================================================="
          echo "FATAL: DATABASE_URL or DIRECT_URL is empty."
          echo "Add BOTH '_DATABASE_URL' and '_DIRECT_URL' substitution"
          echo "variables in the Cloud Build trigger settings"
          echo "(Advanced -> Substitution variables)."
          echo "  _DATABASE_URL = pooler hostname (runtime queries)"
          echo "  _DIRECT_URL   = non-pooler hostname (migrations)"
          echo "==========================================================="
          echo ""
          exit 1
        fi
        cd /app
        echo "DATABASE_URL + DIRECT_URL set; running prisma migrate deploy from /app..."
        npx prisma migrate deploy
    env:
      - 'DATABASE_URL=${_DATABASE_URL}'
      - 'DIRECT_URL=${_DIRECT_URL}'

  # 4. Deploy the new revision with bumped resources to give Nest cold-start
  #    plenty of headroom (the container no longer waits on migrations).
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'medical-backend-git'
      - '--image=gcr.io/$PROJECT_ID/medical-backend:$COMMIT_SHA'
      - '--region=asia-southeast1'
      - '--platform=managed'
      - '--cpu=2'
      - '--memory=1Gi'
      - '--cpu-boost'

substitutions:
  # Override in the Cloud Build trigger settings — leave blank here so
  # nothing sensitive is committed.
  _DATABASE_URL: ''
  _DIRECT_URL: ''

images:
  - 'gcr.io/$PROJECT_ID/medical-backend:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
