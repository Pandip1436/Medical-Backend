# Cloud Build pipeline for the medical-backend service.
#
# Migrations now run as a dedicated Cloud Build step (see "migrate" below)
# instead of inside the container's CMD. Two reasons:
#   1. The container had a 240s startup probe; cold-start + Neon wake +
#      `prisma migrate deploy` could exceed it, so deploys were timing out.
#   2. Migration failures should fail the build clearly, not silently crash-
#      loop the container while traffic stays on the old revision.
#
# Required Cloud Build trigger setting:
#   Substitution variable `_DATABASE_URL` = the PROD Neon connection string.
#   (Set in the Cloud Build trigger UI — never commit it.)

steps:
  # 1. Build the production image.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/medical-backend:$COMMIT_SHA'
      - '.'

  # 2. Push the image to GCR.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/medical-backend:$COMMIT_SHA'

  # 3. Apply Prisma migrations to PROD using the just-built image. If this
  #    step fails the deploy is aborted and the previous revision keeps
  #    serving traffic — much safer than crash-looping a half-migrated app.
  - name: 'gcr.io/$PROJECT_ID/medical-backend:$COMMIT_SHA'
    id: 'migrate'
    entrypoint: 'sh'
    args:
      - '-c'
      - 'npx prisma migrate deploy'
    env:
      - 'DATABASE_URL=${_DATABASE_URL}'

  # 4. Deploy the new revision with bumped resources to give Nest cold-start
  #    plenty of headroom (the container no longer waits on migrations).
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'medical-backend-git'
      - '--image=gcr.io/$PROJECT_ID/medical-backend:$COMMIT_SHA'
      - '--region=asia-southeast1'
      - '--platform=managed'
      - '--cpu=2'
      - '--memory=1Gi'
      - '--cpu-boost'

substitutions:
  # Override in the Cloud Build trigger settings — leave blank here so
  # nothing sensitive is committed.
  _DATABASE_URL: ''

images:
  - 'gcr.io/$PROJECT_ID/medical-backend:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
